            bgColor: '#BADCF5', textColor: '#BADCF5', boxColor: '#814400' },

            bgColor: '#006649', textColor: '#006649', boxColor: '#F6BECE' },
            { paragraphs: [{ text: "웹을 만든 사람이다. 프로토와 한글꼴연구회 소속으로, 이번 전시에는 프로토로 참여했다. 아버지가 말씀하시길, 경북 사투리와 경남 사투리가 섞여 있다고 한다.", indent: 0 }],

        let activeLayer = document.getElementById('layerA');
        let nextLayer = document.getElementById('layerB');
        let activeBox = document.getElementById('boxA');
        let nextBox = document.getElementById('boxB');

        let currentIndex = 0;
        let accumulatedDeltaX = 0;
        let accumulatedDeltaY = 0;
        let isTransitioning = false;
        let isCooldown = false;
        let isSpecialScreen = false;

        const SENSITIVITY_THRESHOLD = 600;
        const IDLE_SHUFFLE_TIMEOUT = 8000; // 셔플 쿨타임
        let idleShuffleTimer = null;

        // 인디자인 합성 글꼴 파싱 함수
        function getCompositeHTML(text) {
            const regex = /([.,!?'"“”‘’⋯:;]+)|([a-zA-Z0-9#$%&()*+<\=>@\[\\\]^_`{|}~-]+)|([가-힣ㄱ-ㅎㅏ-ㅣ]+)/g;
            
            return text.replace(regex, (match, punct, latin, ko) => {
                if (punct) return `<span class="punct">${punct}</span>`;
                if (latin) return `<span class="latin-num-sym">${latin}</span>`;
                if (ko) return `<span class="ko">${ko}</span>`;
                return match;
            });
        }

       // 페이지 렌더링 함수
        function renderPage(layerEl, boxEl, pageData) {
    
        layerEl.style.backgroundColor = pageData.bgColor || pageData.color || '#FFFFFF'; 
        boxEl.innerHTML = '';
            
            pageData.paragraphs.forEach(p => {
            const block = document.createElement('div');
            block.className = 'text-block composite-text';
            block.style.color = pageData.color;

            const indentValue = typeof p.indent === 'number' ? `${p.indent * 2.6}vw` : (p.indent || '0px');

            // 1. 들여쓰기 전용 투명 박스 생성
            if (p.indent && p.indent !== 0) {
                const indentSpan = document.createElement('span');
                indentSpan.className = 'indent-box';
                indentSpan.style.width = indentValue;
                block.appendChild(indentSpan);
            }

            // 2. 실제 흰색 박스 및 텍스트
            const contentSpan = document.createElement('span');
            contentSpan.className = 'text-content';
            contentSpan.innerHTML = getCompositeHTML(p.text);

            contentSpan.style.backgroundColor = pageData.boxColor || '#FFFFFF';
            contentSpan.style.color = pageData.textColor || pageData.color;

            block.appendChild(contentSpan);
            boxEl.appendChild(block);
        });
            const noticeEl = layerEl.querySelector('.top-right-notice');
            if (noticeEl) {
                renderTopNotice(noticeEl, pageData.boxColor || '#FFFFFF');
            }

        }

       let lastDetailIndex = { nayoung: -1, youju: -1 };

        function showDetail(key) {
        if (isTransitioning) return;
        const list = detailData[key];
        if (!list || list.length === 0) return;

        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * list.length);
        } while (list.length > 1 && randomIndex === lastDetailIndex[key]);

        lastDetailIndex[key] = randomIndex;
        renderPage(activeLayer, activeBox, list[randomIndex]);
        }

        // 상단 문구 파싱 렌더링 함수 (합성 글꼴 적용)
        function renderTopNotice(containerEl, boxColor) {
            if (!containerEl) return;

            containerEl.style.color = boxColor || '#FFFFFF';

            containerEl.innerHTML = `
                <span class="click-word" onclick="showRandomMain()">${getCompositeHTML('이 곳')}</span>${getCompositeHTML('에서는 ')}
                <span class="click-word" onclick="showDetail('nayoung')">${getCompositeHTML('김나영')}</span>${getCompositeHTML('과 ')}
                <span class="click-word" onclick="showDetail('youju')">${getCompositeHTML('정유주')}</span>${getCompositeHTML(' 두 사람이 의식의 흐름대로 나눈 대화를 ')}
                <span class="click-word" onclick="showSearchInput()">${getCompositeHTML('엿볼 수 있다')}</span>.
            `;
        }
        // '이 곳' 클릭
        function showRandomMain() {
            if (isTransitioning) return;
            isSpecialScreen = false;

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * pagesData.length);
            } while (randomIndex === currentIndex && pagesData.length > 1);

            currentIndex = randomIndex;
            renderPage(activeLayer, activeBox, pagesData[currentIndex]);
        }

        

        // 초기 화면 세팅
        currentIndex = Math.floor(Math.random() * pagesData.length);
        renderPage(activeLayer, activeBox, pagesData[currentIndex]);

        // 4방향 슬라이드 실행 함수
        function slideToDirection(dir) {
            isTransitioning = true;
            isSpecialScreen = false;

            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * pagesData.length);
            } while (nextIndex === currentIndex && pagesData.length > 1);

            renderPage(nextLayer, nextBox, pagesData[nextIndex]);
            nextLayer.style.transition = 'none';

            let fromClass = '', toClass = '';
            if (dir === 'down')      { fromClass = 'from-down';  toClass = 'to-up'; } 
            else if (dir === 'up')   { fromClass = 'from-up';    toClass = 'to-down'; } 
            else if (dir === 'right'){ fromClass = 'from-right'; toClass = 'to-left'; } 
            else if (dir === 'left') { fromClass = 'from-left';  toClass = 'to-right'; }

            nextLayer.className = `slide ${fromClass}`;
            void nextLayer.offsetWidth;

            nextLayer.style.transition = 'transform 0.75s cubic-bezier(0.25, 1, 0.35, 1)';
            activeLayer.style.transition = 'transform 0.75s cubic-bezier(0.25, 1, 0.35, 1)';

            nextLayer.className = 'slide current';
            activeLayer.className = `slide ${toClass}`;

            const tempLayer = activeLayer; activeLayer = nextLayer; nextLayer = tempLayer;
            const tempBox = activeBox; activeBox = nextBox; nextBox = tempBox;

            currentIndex = nextIndex;

            setTimeout(() => {
                isTransitioning = false;
            }, 750);
        }
        // 셔플 타이머
        function startIdleShuffleTimer() {
        clearTimeout(idleShuffleTimer);
        idleShuffleTimer = setTimeout(() => {
            if (!isTransitioning && !isCooldown && !isSpecialScreen) {   
                const dirs = ['up', 'down', 'left', 'right'];
                const randomDir = dirs[Math.floor(Math.random() * dirs.length)];
                slideToDirection(randomDir);
            }
            startIdleShuffleTimer();
        }, IDLE_SHUFFLE_TIMEOUT);
    }

        startIdleShuffleTimer();

        window.addEventListener('click', () => {
        startIdleShuffleTimer();
        });

        window.addEventListener('wheel', (e) => {
            startIdleShuffleTimer(); 
            if (isTransitioning || isCooldown) return;

            accumulatedDeltaX += e.deltaX;
            accumulatedDeltaY += e.deltaY;

            const absX = Math.abs(accumulatedDeltaX);
            const absY = Math.abs(accumulatedDeltaY);

            if (absY >= SENSITIVITY_THRESHOLD || absX >= SENSITIVITY_THRESHOLD) {
                let direction = '';
                if (absY >= absX) {
                    direction = accumulatedDeltaY > 0 ? 'down' : 'up';
                } else {
                    direction = accumulatedDeltaX > 0 ? 'right' : 'left';
                }

                isCooldown = true;
                slideToDirection(direction);

                accumulatedDeltaX = 0;
                accumulatedDeltaY = 0;
            }

            clearTimeout(window.scrollDecayTimeout);
            window.scrollDecayTimeout = setTimeout(() => {
                accumulatedDeltaX = 0;
                accumulatedDeltaY = 0;
                isCooldown = false;
            }, 200);
        });
        

function handleInputKey(event, nextId) {
    if (event.key === 'Enter' || event.keyCode === 13) {
        event.preventDefault(); // 기본 동작(줄바꿈) 막기
 
        if (nextId === 'submit') {
            submitSearch();
        } else {
            const nextField = document.getElementById(nextId);
            if (nextField) nextField.focus();
        }
    }
}

function submitSearch() {
    const title = document.getElementById('input1').textContent.trim();
    const firstWord = document.getElementById('input2').textContent.trim();
    const time = document.getElementById('input3').textContent.trim();
    const matchIndex = pagesData.findIndex(p => {
        
        if (!p.searchKeys) return false;

        const keys = p.searchKeys;
        const matchTitle = !title || (Array.isArray(keys.title) ? keys.title.includes(title) : keys.title === title);
        const matchWord = !firstWord || (Array.isArray(keys.firstWord) ? keys.firstWord.includes(firstWord) : keys.firstWord === firstWord);
        const matchTime = !time || (Array.isArray(keys.time) ? keys.time.includes(time) : keys.time === time);
        return matchTitle && matchWord && matchTime;
    });

    if (matchIndex !== -1) {
        isSpecialScreen = false;
        currentIndex = matchIndex;
        renderPage(activeLayer, activeBox, pagesData[matchIndex]);
        startIdleShuffleTimer();
    }
}

        // 검색창 색상 팔레트
        // bgColor: 화면 전체 배경, boxColor: 검색창(청록 박스) 배경, textColor: 검색창 글자색, placeholderColor: 플레이스홀더 글자색
        const searchColorPalette = [

            { bgColor: '#ECE0EE', textColor: '#ECE0EE', boxColor: '#0058A2' },
            { bgColor: '#0058A2', textColor: '#0058A2', boxColor: '#ECE0EE' },

            { bgColor: '#7B2B34', textColor: '#7B2B34', boxColor: '#FBD9D3' },
            { bgColor: '#FEF7A5', textColor: '#FEF7A5', boxColor: '#002D2C' },
            { bgColor: '#002D2C', textColor: '#002D2C', boxColor: '#FEF7A5' },
            { bgColor: '#C6DAE3', textColor: '#C6DAE3', boxColor: '#D94715' },
            { bgColor: '#D94715', textColor: '#D94715', boxColor: '#C6DAE3'  },
            { bgColor: '#FFE97B', textColor: '#FFE97B', boxColor: '#006991' },
            { bgColor: '#006991', textColor: '#006991', boxColor: '#FFE97B' },
            { bgColor: '#DBECCF', textColor: '#DBECCF', boxColor: '#E0280F' },
            { bgColor: '#E0280F', textColor: '#E0280F', boxColor: '#DBECCF' },
            { bgColor: '#BADCF5', textColor: '#BADCF5', boxColor: '#814400' },
            { bgColor: '#814400', textColor: '#814400', boxColor: '#BADCF5' },
            { bgColor: '#F6BECE', textColor: '#F6BECE', boxColor: '#006649' },

            { bgColor: '#FFE97B', textColor: '#FFE97B', boxColor: '#6C288B' }
        ];
        let lastSearchColorIndex = -1;

        // 검색 UI 
function showSearchInput() {
    if (isTransitioning) return;
    isSpecialScreen = true

    let colorIndex;
    do {
        colorIndex = Math.floor(Math.random() * searchColorPalette.length);
    } while (searchColorPalette.length > 1 && colorIndex === lastSearchColorIndex);
    lastSearchColorIndex = colorIndex;
    const palette = searchColorPalette[colorIndex];

    activeLayer.style.backgroundColor = palette.bgColor;
    activeBox.innerHTML = '';

    const noticeEl = activeLayer.querySelector('.top-right-notice');
    if (noticeEl) {
        renderTopNotice(noticeEl, palette.boxColor);
    }

    const searchWrapper = document.createElement('div');
    searchWrapper.className = 'search-box-wrapper composite-text';
    searchWrapper.style.setProperty('--search-box-color', palette.boxColor);
    searchWrapper.style.setProperty('--search-text-color', palette.textColor);
    searchWrapper.style.setProperty('--search-placeholder-color', palette.placeholderColor);

    searchWrapper.addEventListener('wheel', (e) => e.stopPropagation());
    searchWrapper.addEventListener('mousedown', (e) => e.stopPropagation());

   searchWrapper.innerHTML = `
        <span class="search-spacer"></span><!-- 공간 확보 -->
        <span class="search-content">
            <span class="search-field" id="input1" contenteditable="true" data-placeholder="책 제목" onkeydown="handleInputKey(event, 'input2')"></span><!--
         --><span class="search-divider">${getCompositeHTML(',')}</span><!--
         --><span class="search-field" id="input2" contenteditable="true" data-placeholder=" 첫 단어" onkeydown="handleInputKey(event, 'input3')"></span><!--
         --><span class="search-divider">${getCompositeHTML(',')}</span><!--
         --><span class="search-field" id="input3" contenteditable="true" data-placeholder=" 발화 시간  " onkeydown="handleInputKey(event, 'submit')"></span>
        </span>
    `;

    activeBox.appendChild(searchWrapper);

    const fields = searchWrapper.querySelectorAll('.search-field');
    fields.forEach(field => {
        field.addEventListener('click', (e) => e.stopPropagation());
        field.addEventListener('mousedown', (e) => e.stopPropagation());
    });

    setTimeout(() => {
        const firstInput = document.getElementById('input1');
        if (firstInput) firstInput.focus();
    }, 100);
}

window.addEventListener('wheel', (e) => {
    if (e.target.closest('.search-box-wrapper')) return;
    startIdleShuffleTimer();
    if (isTransitioning || isCooldown) return;

    accumulatedDeltaX += e.deltaX;
    accumulatedDeltaY += e.deltaY;

    const absX = Math.abs(accumulatedDeltaX);
    const absY = Math.abs(accumulatedDeltaY);

    if (absY >= SENSITIVITY_THRESHOLD || absX >= SENSITIVITY_THRESHOLD) {
        let direction = '';
        if (absY >= absX) {
            direction = accumulatedDeltaY > 0 ? 'down' : 'up';
        } else {
            direction = accumulatedDeltaX > 0 ? 'right' : 'left';
        }

        isCooldown = true;
        slideToDirection(direction);

        accumulatedDeltaX = 0;
        accumulatedDeltaY = 0;
    }

    clearTimeout(window.scrollDecayTimeout);
    window.scrollDecayTimeout = setTimeout(() => {
        accumulatedDeltaX = 0;
        accumulatedDeltaY = 0;
        isCooldown = false;
    }, 200);
});
